name: Build Impostor 3DS CIA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Instalar ferramentas de build
        shell: bash
        run: |
          (apt-get update -qq && apt-get install -y -qq wget unzip) || true
          set -euo pipefail
          for u in https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip https://github.com/Steveice10/bannertool/releases/download/1.2.0/bannertool.zip; do
            wget -q "$u" -O bannertool.zip && break
          done
          unzip -o -j bannertool.zip "linux-x86_64/bannertool" -d /usr/local/bin
          for u in https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip; do
            wget -q "$u" -O makerom.zip && break
          done
          unzip -o makerom.zip makerom -d /usr/local/bin
          chmod a+x /usr/local/bin/makerom /usr/local/bin/bannertool
          command -v makerom
          command -v bannertool
      - name: Compilar o jogo e gerar o CIA
        shell: bash
        run: |
          set -euo pipefail
          make clean all
          bash build_cia.sh
      - name: Disponibilizar o CIA para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Impostor3DS-CIA-Old3DS
          path: Impostor3DS.cia
          if-no-files-found: error
          retention-days: 14
